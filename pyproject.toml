[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kroch-chhmar"
version = "0.2.0"
description = "Workflow for generating Sudachi-compatible Khmer dictionaries and KCC-aware word segmentation plugin"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Sovannarong Koek", email = "sovannarongkoek@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
keywords = ["khmer", "word-segmentation", "morphological-analysis", "sudachi", "nlp"]
dependencies = [
    "sudachipy>=0.6.8",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
]
example = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
kroch-chhmar = "kroch_chhmar.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kroch_chhmar"]

[tool.hatch.build.targets.sdist]
include = [
    "src/kroch_chhmar",
    "data/seed",
    "configs",
    "example",
    "assets",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
    "B008",  # Typer/Click option defaults are function calls by design.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["src/kroch_chhmar"]
